[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP gateway enforcing identity/intent/data governance in front of GitHub"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "openai>=1.50",
    "streamlit>=1.39",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live GitHub credentials and network access",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "agents", "app"]
